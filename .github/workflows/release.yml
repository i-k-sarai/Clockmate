name: Release

# Every merge (push) to main: test, build Android + iOS, publish a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a newer merge doesn't cancel one already publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Version name comes from pubspec.yaml; the build number is the run
        # number, so it always increases and Android can install over it.
        run: |
          name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/' | tr -d '[:space:]')
          build=${{ github.run_number }}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$name-build.$build" >> "$GITHUB_OUTPUT"

  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; the APK will be debug-signed and cannot update a previous install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          # storeFile is resolved relative to android/ (rootProject).
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - run: flutter pub get
      - name: Build APK and App Bundle
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.build }}
          flutter build appbundle --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.build }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ClockMate-${{ needs.version.outputs.tag }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/ClockMate-${{ needs.version.outputs.tag }}.aab"

      - name: Remove signing files
        if: always()
        run: rm -f android/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    name: Build iOS
    needs: [version, test]
    # Xcode 26 is needed for the AlarmKit (iOS 26) code.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get

      # No Apple signing certificate in CI: build unsigned. The .ipa can be
      # sideloaded (AltStore, Sideloadly) or re-signed with your own team.
      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.build }}

      - name: Package .ipa
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/ClockMate-${{ needs.version.outputs.tag }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ClockMate ${{ needs.version.outputs.name }} (build ${{ needs.version.outputs.build }})
          generate_release_notes: true
          make_latest: "true"
          body: |
            ## Downloads
            | Platform | File |
            | --- | --- |
            | Android (install directly) | `ClockMate-${{ needs.version.outputs.tag }}.apk` |
            | Android (Play Store bundle) | `ClockMate-${{ needs.version.outputs.tag }}.aab` |
            | iOS (unsigned, sideload or re-sign) | `ClockMate-${{ needs.version.outputs.tag }}-unsigned.ipa` |

            Verify downloads with `SHA256SUMS.txt`.
          files: dist/*
          fail_on_unmatched_files: true
